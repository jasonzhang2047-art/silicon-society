name: Crawl & deploy

on:
  schedule:
    # Twice a day, offset from the top of the hour (GitHub delays jobs queued at :00).
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-scan the last 120 days instead of the last few"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-and-deploy
  cancel-in-progress: false

jobs:
  crawl:
    # Code pushes only rebuild; scheduled and manual runs crawl first.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Crawl sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional — each unlocks more coverage or precision. Leave unset to skip.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          BACKFILL: ${{ inputs.backfill && '1' || '' }}
        run: npm run crawl
      - name: Commit data
        run: |
          git config user.name "silicon-society-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: crawl $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  deploy:
    needs: [crawl]
    if: always() && (needs.crawl.result == 'success' || needs.crawl.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # pick up the data commit from the crawl job
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
